<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Anitha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pattern {
            font-family: monospace;
            font-size: 16px;
            line-height: 1.2;
            color: #ff5733;
            margin-bottom: 20px;
        }
        .marquee {
            font-size: 24px;
            font-weight: bold;
            color: #ff5733;
            border: 2px solid #ff5733;
            padding: 10px;
            background-color: #fff;
            display: inline-block;
            animation: marquee 10s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        .message {
            margin-top: 20px;
            font-size: 20px;
            color: #000;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Asterisk Pattern -->
    <div class="pattern">
        <pre>
  *       *   ******   *      *   ******
  * *   * *   *        *      *   *
  *  * *  *   *****    *      *   *****
  *   *   *   *        *      *   *
  *       *   ******   ******   ******
        </pre>
    </div>

    <!-- Marquee Text -->
    <div class="marquee">
        *** Hii Anitha , panda ki inform chesava like***
    </div>

    <!-- Image -->
    <img src="panda.jpeg" alt="Hi Panda ❤️">

    <!-- Additional Message -->
    <div class="message">
        Please inform PANDA
    </div>
</body>
</html>
