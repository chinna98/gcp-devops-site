name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # Checkout the code
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Adjust if you are using a different version

      # Install dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      # Build the app (if applicable)
      - name: Build the app
        run: |
          CI=false npm run build --no-ci

      # Deploy to Azure Static Web Apps
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_MUSHROOM_0D3CFC20F }}
          app_location: "/" # App source code path
          deployment_action: "upload"
          output_location: "build" # Path to the built app, adjust if different (e.g., `dist` for Vue)
